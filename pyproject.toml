# Project metadata and tooling configuration.
#
# Runtime dependencies are intentionally NOT declared here: they are managed
# via requirements.txt + constraints.txt (pip-compile pins direct and
# transitive deps). This file centralises project metadata and the lint /
# format / type-check configuration so contributors and CI share one source
# of truth. See CONTRIBUTING.md for the pre-submit check commands.

[project]
name = "stock-scanner"
version = "0.1.0"
description = "台股財報事件驅動掃描與持股分析工具（FastAPI + Cloudflare Pages/Worker/D1/R2）"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "pcedison" }]
keywords = ["taiwan-stock", "fastapi", "cloudflare-workers", "stock-screener"]

[project.urls]
Homepage = "https://github.com/pcedison/stock_scanner"
Repository = "https://github.com/pcedison/stock_scanner"
Issues = "https://github.com/pcedison/stock_scanner/issues"

# --------------------------------------------------------------------------- #
# Ruff: linter + formatter
# Run:  python -m ruff check .   /   python -m ruff format .
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".tmp",
    ".venv",
    "node_modules",
    "cloudflare/python_modules",
    "cloudflare/seed",
]

[tool.ruff.lint]
# A pragmatic starting set. Tighten over time as the codebase is cleaned up.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI uses function calls in argument defaults (Depends/Query/Body)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
# worker.py 以 `from worker_support import *` 注入 Pyodide 執行環境所需的全部
# 符號（已標 noqa: F403），因此 F405（使用可能源自 star import 的名稱）為預期行為。
"cloudflare/worker.py" = ["F405"]
# 此 script 直接執行，需先 sys.path.insert(ROOT) 才能 import backend 套件，
# 因此 backend 匯入必然在頂部之後（E402）。
"scripts/generate_official_failed_report.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "cloudflare", "scripts"]

# --------------------------------------------------------------------------- #
# mypy: static type checking
# CI gate scope: `python -m mypy backend`（backend 套件 import 路徑單一、可乾淨檢查）。
# cloudflare/ 因 Pyodide 平面 import 與本地套件 import 造成同檔雙模組名，scripts/
# 需 sys.path 注入，兩者尚未納入 gate，待後續以 explicit_package_bases 處理。
# 採漸進式導入：下方 overrides 暫時略過目前仍有型別缺口的模組（多為財報數值的
# None 處理），逐模組補齊型別後再從清單移除，最終達成全 backend 嚴格檢查。
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = "(^|/)(\\.tmp|\\.venv|node_modules|cloudflare/(python_modules|seed))/"

# 漸進導入待辦：以下模組仍有待補的型別缺口，暫時不擋 CI。
# 每補齊一個模組的型別就從這份清單移除一行。
[[tool.mypy.overrides]]
module = [
    "backend.adapters.fundamentals_history",
    "backend.adapters.official_fundamentals",
    "backend.services.official_data_provider",
    "backend.services.rules",
    "backend.services.calendar",
    "backend.services.filing_calendar",
    "backend.services.auth",
]
ignore_errors = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

# Project metadata and tooling configuration.
#
# Runtime dependencies are intentionally NOT declared here: they are managed
# via requirements.txt + constraints.txt (pip-compile pins direct and
# transitive deps). This file centralises project metadata and the lint /
# format / type-check configuration so contributors and CI share one source
# of truth. See CONTRIBUTING.md for the pre-submit check commands.

[project]
name = "stock-scanner"
version = "0.1.0"
description = "台股財報事件驅動掃描與持股分析工具（FastAPI + Cloudflare Pages/Worker/D1/R2）"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "pcedison" }]
keywords = ["taiwan-stock", "fastapi", "cloudflare-workers", "stock-screener"]

[project.urls]
Homepage = "https://github.com/pcedison/stock_scanner"
Repository = "https://github.com/pcedison/stock_scanner"
Issues = "https://github.com/pcedison/stock_scanner/issues"

# --------------------------------------------------------------------------- #
# Ruff: linter + formatter
# Run:  python -m ruff check .   /   python -m ruff format .
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".tmp",
    ".venv",
    "node_modules",
    "cloudflare/python_modules",
    "cloudflare/seed",
]

[tool.ruff.lint]
# A pragmatic starting set. Tighten over time as the codebase is cleaned up.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI uses function calls in argument defaults (Depends/Query/Body)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
# worker.py 以 `from worker_support import *` 注入 Pyodide 執行環境所需的全部
# 符號（已標 noqa: F403），因此 F405（使用可能源自 star import 的名稱）為預期行為。
"cloudflare/worker.py" = ["F405"]
# 此 script 直接執行，需先 sys.path.insert(ROOT) 才能 import backend 套件，
# 因此 backend 匯入必然在頂部之後（E402）。
"scripts/generate_official_failed_report.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "cloudflare", "scripts"]

# --------------------------------------------------------------------------- #
# mypy: static type checking
# CI gate scope: `python -m mypy backend scripts cloudflare tests`。
# backend / scripts / cloudflare 不使用 per-module ignore_errors overrides；tests
# 只放寬 fixture / fake 慣用 duck typing 所需的少數錯誤碼（見下方 override）。
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
exclude = "(^|/)(\\.tmp|\\.venv|node_modules|cloudflare/(python_modules|seed))/"

[[tool.mypy.overrides]]
# Tests are type-checked too, but their fakes/fixtures lean on duck typing:
# stand-in adapters passed where a concrete type is annotated, attribute access on
# Optional fixture returns, indexing loosely-typed report dicts, and the
# dynamically-loaded Pyodide worker module. Relax those categories for tests while
# keeping the rest of mypy active (untyped defs, bad returns, missing annotations,
# unused ignores).
module = "tests.*"
disable_error_code = ["arg-type", "attr-defined", "union-attr", "index"]


# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
]

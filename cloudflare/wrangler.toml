name = "stock-scanner-beta-api"
main = "worker.py"
compatibility_date = "2026-05-14"
compatibility_flags = ["python_workers", "disable_python_no_global_handlers", "disable_python_external_sdk"]
workers_dev = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
persist = true

[vars]
APP_ENV = "production"
APP_CORS_ALLOW_ORIGINS = "https://stock-scanner-beta.pages.dev"
GITHUB_REPOSITORY = "pcedison/stock_scanner"
GITHUB_DISPATCH_ENABLED = "true"
GITHUB_REFRESH_WORKFLOW_FILE = "cloudflare-r2-seed-refresh.yml"
GITHUB_REFRESH_WORKFLOW_REF = "main"
MARKET_SCAN_API_VERSION = "v2"
EDGE_CACHE_ENABLED = "true"

# Worker cron is the scheduled trigger for the R2 seed refresh. Each tick queues a
# refresh when the seed is stale or within the refresh-ahead window and dispatches
# .github/workflows/cloudflare-r2-seed-refresh.yml through the GitHub API, signing in
# as a GitHub App so no credential here has to be rotated before it expires.
# GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID and GITHUB_APP_PRIVATE_KEY are all Worker
# secrets rather than vars: this repository is public. Cron times are UTC.
[triggers]
crons = [
  "*/20 21-23 * * SUN-THU", # Taipei 05:00-07:59 Mon-Fri: morning publication slot (06:30)
  "*/20 0-13 * * MON-FRI",  # Taipei 08:00-21:59 Mon-Fri: evening slot (18:00) + three hourly failed-build retries
]

[cache]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "stock-scanner-beta-db"
database_id = "c29c7b4a-4a2d-4711-badd-1aaad43ce3b6"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CACHE"
bucket_name = "stock-scanner-beta-cache"

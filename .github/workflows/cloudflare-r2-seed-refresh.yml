name: Refresh Cloudflare R2 Seed

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and upload even when no queued D1 refresh job exists."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      CF_R2_BUCKET: stock-scanner-beta-cache
      CF_D1_DATABASE: stock-scanner-beta-db
      CF_D1_DATABASE_ID: c29c7b4a-4a2d-4711-badd-1aaad43ce3b6
      CF_WORKER_HEALTH_URL: ${{ vars.CF_WORKER_HEALTH_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Early exit - check pending jobs without heavy dependencies
        id: early-check
        run: |
          mkdir -p .tmp
          force_args=()
          api_args=()
          job_check_args=()
          health_args=()
          if [ "$FORCE_REFRESH" = "true" ]; then
            force_args=(--force)
          else
            set +e
            curl -sf --max-time 10 -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${CF_D1_DATABASE_ID}/query" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"sql":"SELECT COUNT(*) AS cnt FROM refresh_jobs WHERE job_type = '"'"'market_scan'"'"' AND status IN ('"'"'queued'"'"','"'"'running'"'"')"}' \
              --output .tmp/early-d1.json 2>/dev/null
            api_status=$?
            set -e
            if [ "$api_status" -eq 0 ]; then
              api_args=(--cloudflare-api-json-file .tmp/early-d1.json)
            else
              job_check_error="D1 pending-job query unavailable"
              job_check_args=(--job-check-error "$job_check_error")
            fi
            if [ -n "$CF_WORKER_HEALTH_URL" ]; then
              if health=$(curl -sf --max-time 15 "$CF_WORKER_HEALTH_URL" 2>/dev/null); then
                printf '%s' "$health" > .tmp/early-health.json
                health_args=(--health-url-configured --health-json-file .tmp/early-health.json)
              else
                health_args=(--health-url-configured --health-error "unreachable")
              fi
            fi
          fi

          python scripts/r2_refresh_decision.py early-check \
            "${force_args[@]}" \
            "${api_args[@]}" \
            "${job_check_args[@]}" \
            "${health_args[@]}" \
            --max-cache-age-hours 36 \
            --refresh-ahead-minutes 60 \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        if: steps.early-check.outputs.run_refresh == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        if: steps.early-check.outputs.run_refresh == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install dependencies
        if: steps.early-check.outputs.run_refresh == 'true'
        run: |
          npm ci
          pip install -r requirements.txt -c constraints.txt

      - name: Apply D1 migrations
        if: steps.early-check.outputs.run_refresh == 'true'
        run: npx wrangler d1 migrations apply "$CF_D1_DATABASE" --remote --config cloudflare/wrangler.toml

      - name: Check pending market refresh jobs
        id: refresh-check
        if: steps.early-check.outputs.run_refresh == 'true'
        run: |
          mkdir -p .tmp
          if [ "$FORCE_REFRESH" = "true" ]; then
            echo "pending_count=manual" >> "$GITHUB_OUTPUT"
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            echo "Manual force refresh requested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npx wrangler d1 execute "$CF_D1_DATABASE" \
            --remote \
            --config cloudflare/wrangler.toml \
            --json \
            --command "SELECT COUNT(*) AS pending_count FROM refresh_jobs WHERE job_type = 'market_scan' AND status IN ('queued', 'running');" \
            > .tmp/refresh-job-count.json

          pending_count="$(python scripts/r2_refresh_decision.py pending-count --json-file .tmp/refresh-job-count.json --fields pending_count)"

          stale_refresh="${{ steps.early-check.outputs.stale_refresh }}"
          if [ -n "$CF_WORKER_HEALTH_URL" ]; then
            if python scripts/check_cloudflare_health.py \
              --url "$CF_WORKER_HEALTH_URL" \
              --max-cache-age-hours 36 \
              --max-refresh-delay-minutes 15 \
              --reject-offline-seed \
              > .tmp/production-health.json 2> .tmp/production-health.err; then
              echo "Production seed freshness is healthy." >> "$GITHUB_STEP_SUMMARY"
            else
              stale_refresh=true
              {
                echo "Production seed freshness check failed; R2 seed rebuild will run."
                echo
                echo '```text'
                cat .tmp/production-health.err
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "CF_WORKER_HEALTH_URL is empty; freshness cannot queue a rebuild." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "pending_count=$pending_count" >> "$GITHUB_OUTPUT"
          echo "stale_refresh=$stale_refresh" >> "$GITHUB_OUTPUT"
          if [ "$pending_count" -gt 0 ] || [ "$stale_refresh" = "true" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when no refresh is queued
        if: steps.early-check.outputs.run_refresh == 'true' && steps.refresh-check.outputs.run_refresh != 'true'
        run: echo "No queued market_scan refresh job and production seed is fresh; skipping R2 seed rebuild." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark queued refresh jobs as running
        if: steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          npx wrangler d1 execute "$CF_D1_DATABASE" \
            --remote \
            --config cloudflare/wrangler.toml \
            --command "UPDATE refresh_jobs SET status = 'running', owner_run_id = '${GITHUB_RUN_ID}', started_at = datetime('now'), updated_at = datetime('now') WHERE job_type = 'market_scan' AND status = 'queued';"

      - name: Rebuild seed from official sources
        if: steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          npx wrangler r2 object get "$CF_R2_BUCKET/official/monthly_revenue_history.json" --remote --file .tmp/r2-monthly-revenue-history.json </dev/null || rm -f .tmp/r2-monthly-revenue-history.json
          python scripts/hydrate_cloudflare_seed_inputs.py --data-dir data --r2-history .tmp/r2-monthly-revenue-history.json
          CLOUDFLARE_SEED_MODE=online python scripts/build_cloudflare_seed.py
          python scripts/package_cloudflare_seed_cache.py
          python scripts/generate_official_failed_report.py
          SEED_ZIP=$(python scripts/seed_utils.py data --print)
          python scripts/validate_cloudflare_seed_inputs.py \
            --zip "$SEED_ZIP" \
            --summary-md .tmp/seed-quality.md \
            --summary-json .tmp/seed-quality.json \
            --max-age-days 3
          cat .tmp/seed-quality.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rebuilt seed cache to R2
        if: steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          python scripts/cloudflare_seed_upload_plan.py \
            --seed-dir cloudflare/seed \
            --data-dir data \
            --output-json .tmp/r2-upload-plan.json \
            --output-tsv .tmp/r2-upload-plan.tsv
          put_with_retry() {
            object_key="$1"
            file_path="$2"
            attempt=1
            max_attempts=5
            delay=5
            while true; do
              if npx wrangler r2 object put "$CF_R2_BUCKET/$object_key" --remote --file "$file_path" </dev/null; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "R2 上傳 $object_key 失敗：已重試 $max_attempts 次仍未成功" >&2
                return 1
              fi
              echo "R2 上傳 $object_key 第 $attempt 次失敗，${delay}s 後重試..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          while IFS=$'\t' read -r object_key file_path; do
            # Preserve the generated order: immutable pages/index first and the public pointer last.
            put_with_retry "$object_key" "$file_path"
          done < .tmp/r2-upload-plan.tsv

      - name: Verify refreshed production seed
        if: steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          if [ -z "$CF_WORKER_HEALTH_URL" ]; then
            echo "CF_WORKER_HEALTH_URL repository variable must point to the deployed /api/health endpoint." >&2
            exit 1
          fi
          python scripts/check_cloudflare_health.py \
            --url "$CF_WORKER_HEALTH_URL" \
            --manifest cloudflare/seed/manifest.json \
            --max-cache-age-hours 36 \
            --max-refresh-delay-minutes 15 \
            --reject-offline-seed
          python scripts/run_remote_smoke.py \
            --health-url "$CF_WORKER_HEALTH_URL" \
            --manifest cloudflare/seed/manifest.json \
            --max-cache-age-hours 36 \
            --max-refresh-delay-minutes 15 \
            --reject-offline-seed

      - name: Mark refresh jobs as completed
        if: steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          npx wrangler d1 execute "$CF_D1_DATABASE" \
            --remote \
            --config cloudflare/wrangler.toml \
            --command "UPDATE refresh_jobs SET status = 'success', finished_at = datetime('now'), updated_at = datetime('now'), error = NULL WHERE job_type = 'market_scan' AND status = 'running' AND owner_run_id = '${GITHUB_RUN_ID}';"

      - name: Mark refresh jobs as failed
        if: failure() && steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          npx wrangler d1 execute "$CF_D1_DATABASE" \
            --remote \
            --config cloudflare/wrangler.toml \
            --command "UPDATE refresh_jobs SET status = 'failed', finished_at = datetime('now'), updated_at = datetime('now'), error = 'GitHub Actions run ${GITHUB_RUN_ID} failed' WHERE job_type = 'market_scan' AND status = 'running' AND owner_run_id = '${GITHUB_RUN_ID}';"

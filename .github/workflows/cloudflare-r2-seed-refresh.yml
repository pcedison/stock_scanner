name: Refresh Cloudflare R2 Seed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and upload even when no queued D1 refresh job exists."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-r2-seed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      CF_R2_BUCKET: stock-scanner-beta-cache
      CF_D1_DATABASE: stock-scanner-beta-db
      # D1 database_id from cloudflare/wrangler.toml (not secret, it's committed)
      CF_D1_DATABASE_ID: c29c7b4a-4a2d-4711-badd-1aaad43ce3b6
      CF_WORKER_HEALTH_URL: ${{ vars.CF_WORKER_HEALTH_URL }}

    steps:
      # Lightweight pre-check: query D1 via REST API and check health URL
      # This runs before checkout/npm/pip so empty runs exit in < 10 seconds.
      - name: Early exit — check pending jobs without heavy dependencies
        id: early-check
        run: |
          if [ "$FORCE_REFRESH" = "true" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            echo "Force refresh requested via workflow_dispatch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pending=0
          if api_result=$(curl -sf --max-time 10 -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${CF_D1_DATABASE_ID}/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"sql":"SELECT COUNT(*) AS cnt FROM refresh_jobs WHERE job_type = '"'"'market_scan'"'"' AND status IN ('"'"'queued'"'"','"'"'running'"'"')"}' 2>/dev/null); then
            pending=$(python3 -c "
import sys, json
try:
    d = json.loads(sys.argv[1])
    r = d.get('result', [{}])
    results = r[0].get('results', [{}]) if isinstance(r, list) and r else [{}]
    print(int(results[0].get('cnt', 0) if isinstance(results, list) and results else 0))
except Exception:
    print(0)
" "$api_result" 2>/dev/null || echo 0)
          fi

          stale=false
          if [ -n "$CF_WORKER_HEALTH_URL" ]; then
            if health=$(curl -sf --max-time 15 "$CF_WORKER_HEALTH_URL" 2>/dev/null); then
              age_hours=$(python3 -c "
import sys, json
from datetime import datetime, timezone
try:
    d = json.loads(sys.argv[1])
    generated_at = d.get('cache', {}).get('generatedAt', '')
    if not generated_at:
        print(999)
        sys.exit()
    dt = datetime.fromisoformat(generated_at.replace('Z', '+00:00'))
    age = (datetime.now(timezone.utc) - dt).total_seconds() / 3600
    print(int(age))
except Exception:
    print(999)
" "$health" 2>/dev/null || echo 999)
              if [ "$age_hours" -gt 36 ]; then
                stale=true
                echo "Production seed is stale (${age_hours}h old); R2 rebuild will run." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Production seed is fresh (${age_hours}h old)." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              stale=true
              echo "Health URL unreachable; treating as stale." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          echo "pending_count=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" -gt 0 ] || [ "$stale" = "true" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
            echo "No pending refresh jobs and seed is fresh — skipping heavy setup." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out repository
        if: steps.early-check.outputs.run_refresh == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.early-check.outputs.run_refresh == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        if: steps.early-check.outputs.run_refresh == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install dependencies
        if: steps.early-check.outputs.run_refresh == 'true'
        run: |
          npm ci
          pip install -r requirements.txt -c constraints.txt

      - name: Apply D1 migrations
        if: steps.early-check.outputs.run_refresh == 'true'
        run: npx wrangler d1 migrations apply "$CF_D1_DATABASE" --remote --config cloudflare/wrangler.toml

      - name: Check pending market refresh jobs
        id: refresh-check
        if: steps.early-check.outputs.run_refresh == 'true'
        run: |
          mkdir -p .tmp
          if [ "$FORCE_REFRESH" = "true" ]; then
            echo "pending_count=manual" >> "$GITHUB_OUTPUT"
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            echo "Manual force refresh requested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npx wrangler d1 execute "$CF_D1_DATABASE" \
            --remote \
            --config cloudflare/wrangler.toml \
            --json \
            --command "SELECT COUNT(*) AS pending_count FROM refresh_jobs WHERE job_type = 'market_scan' AND status IN ('queued', 'running');" \
            > .tmp/refresh-job-count.json

          pending_count="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path(".tmp/refresh-job-count.json").read_text(encoding="utf-8"))

          def find_pending_count(value):
              if isinstance(value, dict):
                  if "pending_count" in value:
                      return int(value.get("pending_count") or 0)
                  for child in value.values():
                      found = find_pending_count(child)
                      if found is not None:
                          return found
              if isinstance(value, list):
                  for child in value:
                      found = find_pending_count(child)
                      if found is not None:
                          return found
              return None

          pending_count = find_pending_count(payload) or 0
          print(pending_count)
          PY
          )"

          stale_refresh=false
          if [ -n "$CF_WORKER_HEALTH_URL" ]; then
            if python scripts/check_cloudflare_health.py \
              --url "$CF_WORKER_HEALTH_URL" \
              --max-cache-age-hours 36 \
              --reject-offline-seed \
              > .tmp/production-health.json 2> .tmp/production-health.err; then
              echo "Production seed freshness is healthy." >> "$GITHUB_STEP_SUMMARY"
            else
              stale_refresh=true
              {
                echo "Production seed freshness check failed; R2 seed rebuild will run."
                echo
                echo '```text'
                cat .tmp/production-health.err
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "CF_WORKER_HEALTH_URL is empty; freshness cannot queue a rebuild." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "pending_count=$pending_count" >> "$GITHUB_OUTPUT"
          echo "stale_refresh=$stale_refresh" >> "$GITHUB_OUTPUT"
          if [ "$pending_count" -gt 0 ] || [ "$stale_refresh" = "true" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when no refresh is queued
        if: steps.early-check.outputs.run_refresh == 'true' && steps.refresh-check.outputs.run_refresh != 'true'
        run: echo "No queued market_scan refresh job and production seed is fresh; skipping R2 seed rebuild." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark queued refresh jobs as running
        if: steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          npx wrangler d1 execute "$CF_D1_DATABASE" \
            --remote \
            --config cloudflare/wrangler.toml \
            --command "UPDATE refresh_jobs SET status = 'running', started_at = datetime('now'), updated_at = datetime('now') WHERE job_type = 'market_scan' AND status = 'queued';"

      - name: Rebuild seed from official sources
        if: steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          SEED_ZIP=$(ls -t data/official_cache_seed_*.zip 2>/dev/null | head -1)
          if [ -n "$SEED_ZIP" ]; then
            unzip -o "$SEED_ZIP" -d data
          fi
          CLOUDFLARE_SEED_MODE=online python scripts/build_cloudflare_seed.py
          python scripts/package_cloudflare_seed_cache.py
          python scripts/generate_official_failed_report.py
          SEED_ZIP=$(ls -t data/official_cache_seed_*.zip 2>/dev/null | head -1)
          python scripts/validate_cloudflare_seed_inputs.py \
            --zip "$SEED_ZIP" \
            --summary-md .tmp/seed-quality.md \
            --summary-json .tmp/seed-quality.json \
            --max-age-days 3
          cat .tmp/seed-quality.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rebuilt seed cache to R2
        if: steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          npx wrangler r2 object put "$CF_R2_BUCKET/public/manifest.json" --remote --file cloudflare/seed/manifest.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/companies.json" --remote --file cloudflare/seed/companies.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/data_sources_status.json" --remote --file cloudflare/seed/data_sources_status.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/market_scan_latest.json" --remote --file cloudflare/seed/market_scan_latest.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/market_scan_summary.json" --remote --file cloudflare/seed/market_scan_summary.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/analysis_by_code.json" --remote --file cloudflare/seed/analysis_by_code.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/holding_analysis_by_code.json" --remote --file cloudflare/seed/holding_analysis_by_code.json
          for file in cloudflare/seed/analysis_shards/*.json; do
            shard="$(basename "$file" .json)"
            npx wrangler r2 object put "$CF_R2_BUCKET/public/analysis_shards/$shard.json" --remote --file "$file"
          done
          for file in cloudflare/seed/holding_analysis_shards/*.json; do
            shard="$(basename "$file" .json)"
            npx wrangler r2 object put "$CF_R2_BUCKET/public/holding_analysis_shards/$shard.json" --remote --file "$file"
          done
          npx wrangler r2 object put "$CF_R2_BUCKET/official/official_fundamentals_history.json" --remote --file data/official_fundamentals_history.json
          npx wrangler r2 object put "$CF_R2_BUCKET/official/official_history_backfill_progress.json" --remote --file data/official_history_backfill_progress.json
          if [ -f data/monthly_revenue_history.json ]; then
            npx wrangler r2 object put "$CF_R2_BUCKET/official/monthly_revenue_history.json" --remote --file data/monthly_revenue_history.json
          fi
          SEED_ZIP=$(ls -t data/official_cache_seed_*.zip 2>/dev/null | head -1)
          if [ -n "$SEED_ZIP" ]; then
            npx wrangler r2 object put "$CF_R2_BUCKET/official/$(basename "$SEED_ZIP")" --remote --file "$SEED_ZIP"
          fi

      - name: Verify refreshed production seed
        if: steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          if [ -z "$CF_WORKER_HEALTH_URL" ]; then
            echo "CF_WORKER_HEALTH_URL repository variable must point to the deployed /api/health endpoint." >&2
            exit 1
          fi
          python scripts/check_cloudflare_health.py \
            --url "$CF_WORKER_HEALTH_URL" \
            --manifest cloudflare/seed/manifest.json \
            --max-cache-age-hours 36 \
            --reject-offline-seed
          python scripts/run_remote_smoke.py \
            --health-url "$CF_WORKER_HEALTH_URL" \
            --manifest cloudflare/seed/manifest.json \
            --max-cache-age-hours 36 \
            --reject-offline-seed

      - name: Mark refresh jobs as completed
        if: steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          npx wrangler d1 execute "$CF_D1_DATABASE" \
            --remote \
            --config cloudflare/wrangler.toml \
            --command "UPDATE refresh_jobs SET status = 'success', finished_at = datetime('now'), updated_at = datetime('now'), error = NULL WHERE job_type = 'market_scan' AND status IN ('queued', 'running');"

      - name: Mark refresh jobs as failed
        if: failure() && steps.refresh-check.outputs.run_refresh == 'true'
        run: |
          npx wrangler d1 execute "$CF_D1_DATABASE" \
            --remote \
            --config cloudflare/wrangler.toml \
            --command "UPDATE refresh_jobs SET status = 'failed', finished_at = datetime('now'), updated_at = datetime('now'), error = 'GitHub Actions run ${GITHUB_RUN_ID} failed' WHERE job_type = 'market_scan' AND status IN ('queued', 'running');"

name: Refresh Cloudflare Seed Cache

on:
  schedule:
    - cron: "35 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cloudflare-seed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Rebuild seed from official sources
        run: |
          python scripts/hydrate_cloudflare_seed_inputs.py --data-dir data
          CLOUDFLARE_SEED_MODE=online python scripts/build_cloudflare_seed.py
          python scripts/package_cloudflare_seed_cache.py
          python scripts/generate_official_failed_report.py
          SEED_ZIP=$(python scripts/seed_utils.py data --print)
          python scripts/validate_cloudflare_seed_inputs.py \
            --zip "$SEED_ZIP" \
            --summary-md .tmp/seed-quality.md \
            --summary-json .tmp/seed-quality.json \
            --max-age-days 45
          cat .tmp/seed-quality.md >> "$GITHUB_STEP_SUMMARY"

      - name: Stop if seed did not change
        id: changes
        run: |
          if git diff --quiet -- \
            data/official_cache_seed_*.zip \
            data/official_cache_seed_*.sha256 \
            data/official_history_failed_companies_*.csv \
            docs/official_history_failed_companies_*.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No seed changes detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open refresh pull request
        if: steps.changes.outputs.changed == 'true'
        run: |
          branch="automation/cloudflare-seed-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ensure the LFS filters are active so the refreshed seed zip is
          # committed as an LFS object per .gitattributes.
          git lfs install --local
          git checkout -B "$branch"
          git add \
            data/official_cache_seed_*.zip \
            data/official_cache_seed_*.sha256 \
            data/official_history_failed_companies_*.csv \
            docs/official_history_failed_companies_*.md
          git commit -m "Refresh Cloudflare seed cache"
          git push --force-with-lease --set-upstream origin "$branch"
          {
            cat .tmp/seed-quality.md
            echo
            echo "Validation:"
            echo "- Rebuilt seed from official sources"
            echo "- Repacked committed seed zip"
            echo "- Revalidated seed quality gates"
          } > .tmp/seed-pr-body.md
          existing_pr="$(gh pr list --head "$branch" --json url --jq '.[0].url')"
          manual_pr_url="https://github.com/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1"
          if [ -n "$existing_pr" ]; then
            if ! gh pr edit "$existing_pr" --body-file .tmp/seed-pr-body.md; then
              echo "::warning::Seed refresh branch was pushed, but the existing PR body could not be updated."
              {
                echo "Seed refresh branch was pushed, but the existing PR body could not be updated."
                echo
                echo "- Existing PR: $existing_pr"
                echo "- Branch: \`$branch\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            if ! gh pr create \
              --title "Refresh Cloudflare seed cache $(date -u +%Y-%m-%d)" \
              --body-file .tmp/seed-pr-body.md \
              --base "${GITHUB_REF_NAME}" \
              --head "$branch"; then
              echo "::warning::Seed refresh branch was pushed, but GitHub Actions is not permitted to create the PR automatically."
              {
                echo "Seed refresh branch was pushed, but GitHub Actions could not create the PR automatically."
                echo
                echo "- Branch: \`$branch\`"
                echo "- Manual PR: $manual_pr_url"
                echo
                echo "Seed rebuild and validation completed before PR creation."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

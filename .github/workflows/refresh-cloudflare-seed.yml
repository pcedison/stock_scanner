name: Refresh Cloudflare Seed Cache

on:
  schedule:
    - cron: "35 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: cloudflare-seed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_R2_BUCKET: stock-scanner-beta-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Rebuild seed from official sources
        run: |
          mkdir -p .tmp
          # The committed zip only carries history up to its snapshot date; the production
          # R2 copies hold the continuously refreshed monthly revenue and quarterly
          # fundamentals history, without which the X2/X3-X5 quality gates reject the build.
          for name in monthly_revenue_history official_fundamentals_history official_history_backfill_progress; do
            npx wrangler r2 object get "$CF_R2_BUCKET/official/${name}.json" --remote --file ".tmp/r2-${name}.json" </dev/null || rm -f ".tmp/r2-${name}.json"
          done
          python scripts/hydrate_cloudflare_seed_inputs.py --data-dir data --r2-history .tmp/r2-monthly_revenue_history.json \
            --r2-fundamentals-history .tmp/r2-official_fundamentals_history.json \
            --r2-backfill-progress .tmp/r2-official_history_backfill_progress.json
          CLOUDFLARE_SEED_MODE=online python scripts/build_cloudflare_seed.py
          python scripts/package_cloudflare_seed_cache.py
          python scripts/generate_official_failed_report.py
          SEED_ZIP=$(python scripts/seed_utils.py data --print)
          python scripts/validate_cloudflare_seed_inputs.py \
            --zip "$SEED_ZIP" \
            --summary-md .tmp/seed-quality.md \
            --summary-json .tmp/seed-quality.json \
            --max-age-days 45
          cat .tmp/seed-quality.md >> "$GITHUB_STEP_SUMMARY"

      - name: Stop if seed did not change
        id: changes
        run: |
          if git diff --quiet -- \
            data/official_cache_seed_*.zip \
            data/official_cache_seed_*.sha256 \
            data/official_history_failed_companies_*.csv \
            docs/official_history_failed_companies_*.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No seed changes detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open refresh pull request
        if: steps.changes.outputs.changed == 'true'
        run: |
          branch="automation/cloudflare-seed-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ensure the LFS filters are active so the refreshed seed zip is
          # committed as an LFS object per .gitattributes.
          git lfs install --local
          git checkout -B "$branch"
          git add \
            data/official_cache_seed_*.zip \
            data/official_cache_seed_*.sha256 \
            data/official_history_failed_companies_*.csv \
            docs/official_history_failed_companies_*.md
          git commit -m "Refresh Cloudflare seed cache"
          git push --force-with-lease --set-upstream origin "$branch"
          {
            cat .tmp/seed-quality.md
            echo
            echo "Validation:"
            echo "- Rebuilt seed from official sources"
            echo "- Repacked committed seed zip"
            echo "- Revalidated seed quality gates"
          } > .tmp/seed-pr-body.md
          existing_pr="$(gh pr list --head "$branch" --json url --jq '.[0].url')"
          manual_pr_url="https://github.com/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1"
          if [ -n "$existing_pr" ]; then
            if ! gh pr edit "$existing_pr" --body-file .tmp/seed-pr-body.md; then
              echo "::warning::Seed refresh branch was pushed, but the existing PR body could not be updated."
              {
                echo "Seed refresh branch was pushed, but the existing PR body could not be updated."
                echo
                echo "- Existing PR: $existing_pr"
                echo "- Branch: \`$branch\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            if ! gh pr create \
              --title "Refresh Cloudflare seed cache $(date -u +%Y-%m-%d)" \
              --body-file .tmp/seed-pr-body.md \
              --base "${GITHUB_REF_NAME}" \
              --head "$branch"; then
              echo "::warning::Seed refresh branch was pushed, but GitHub Actions is not permitted to create the PR automatically."
              {
                echo "Seed refresh branch was pushed, but GitHub Actions could not create the PR automatically."
                echo
                echo "- Branch: \`$branch\`"
                echo "- Manual PR: $manual_pr_url"
                echo
                echo "Seed rebuild and validation completed before PR creation."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # GitHub does not trigger pull_request/push workflows for events created by
          # GITHUB_TOKEN (seen on #170: the seed refresh PR got no checks and needed a
          # manual `gh workflow run ci.yml --ref <branch>`), so dispatch Validate on the
          # branch explicitly. This covers both the new-PR and existing-PR paths above,
          # since the branch is pushed before either path runs.
          if gh workflow run ci.yml --ref "$branch"; then
            echo "Dispatched the Validate workflow for \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not dispatch the Validate workflow for $branch; the PR may show no checks."
            echo "Could not dispatch the Validate workflow for \`$branch\`; the PR may show no checks." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update a failure issue
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly seed cache refresh is failing"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "The scheduled committed-seed refresh failed: $RUN_URL

          Three consecutive failures went unnoticed in 2026-08/09, so this issue is opened automatically. Close it once a run succeeds (the workflow does not close it by itself)."
          fi

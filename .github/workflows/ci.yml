name: Validate

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run quality gates
        run: |
          python -m pytest -q
          python -m pip check
          npm audit --audit-level=low

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Validate committed Cloudflare seed cache
        run: python scripts/validate_cloudflare_seed_inputs.py --zip data/official_cache_seed_2026-05-14.zip

      - name: Rebuild Cloudflare seed dry run
        run: |
          unzip -o data/official_cache_seed_2026-05-14.zip -d data
          python scripts/build_cloudflare_seed.py

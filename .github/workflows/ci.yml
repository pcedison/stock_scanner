name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt

      - name: Run lint and type checks
        run: |
          npm run lint
          python -m ruff check .
          python -m mypy backend scripts cloudflare tests

      - name: Run quality gates
        run: |
          python -m pytest -q --cov=backend --cov-report=term-missing --cov-fail-under=88
          python scripts/check_frontend_hygiene.py
          python scripts/check_operational_readiness.py
          python -m pip check
          npm audit --audit-level=low

      - name: Run security scans
        run: |
          python -m pip install pip-audit bandit
          python -m pip_audit -r constraints.txt
          python -m bandit -q -r backend cloudflare scripts -x .tmp,.venv,node_modules,tests --severity-level medium

      - name: Check deployment preflight guardrails
        run: python scripts/check_deployment_preflight.py

      - name: Validate generated Worker bundle boundary
        run: npx wrangler deploy --config cloudflare/wrangler.toml --dry-run --outdir .tmp/worker-dry-run

      - name: Run local Worker runtime smoke
        run: python scripts/run_wrangler_dev_smoke.py

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Validate committed Cloudflare seed cache
        run: |
          SEED_ZIP=$(python scripts/seed_utils.py data --print)
          SEED_SHA="${SEED_ZIP%.zip}.sha256"
          test -f "$SEED_SHA"
          (
            cd "$(dirname "$SEED_ZIP")"
            sha256sum --check "$(basename "$SEED_SHA")"
          )
          python scripts/validate_cloudflare_seed_inputs.py \
            --zip "$SEED_ZIP" \
            --summary-md .tmp/seed-quality.md \
            --summary-json .tmp/seed-quality.json \
            --max-age-days 45
          cat .tmp/seed-quality.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild Cloudflare seed dry run
        run: |
          SEED_ZIP=$(python scripts/seed_utils.py data --print)
          if [ -n "$SEED_ZIP" ]; then
            unzip -o "$SEED_ZIP" -d data
          fi
          CLOUDFLARE_SEED_MODE=offline python scripts/build_cloudflare_seed.py

  # Additive (non-required) job: run the Python test suite across supported
  # versions and report backend coverage. Keeps the `validate` required check
  # untouched so branch protection still resolves the "validate" context.
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest -q --cov=backend --cov-report=term-missing

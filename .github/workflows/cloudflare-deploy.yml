name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run quality gates
        run: |
          python -m pytest -q
          python scripts/check_frontend_hygiene.py
          python scripts/check_operational_readiness.py
          python -m pip check
          npm audit --audit-level=low

      - name: Run security scans
        run: |
          python -m pip install pip-audit bandit
          python -m pip_audit -r constraints.txt
          python -m bandit -q -r backend cloudflare scripts -x .tmp,.venv,node_modules,tests --severity-level medium

      - name: Check deployment preflight guardrails
        run: python scripts/check_deployment_preflight.py

      - name: Validate generated Worker bundle boundary
        run: npx wrangler deploy --config cloudflare/wrangler.toml --dry-run --outdir .tmp/worker-dry-run

      - name: Run local Worker runtime smoke
        run: python scripts/run_wrangler_dev_smoke.py

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CF_D1_DATABASE: stock-scanner-beta-db
      CF_PAGES_PROJECT: stock-scanner-beta
      CF_PAGES_PRODUCTION_BRANCH: main
      CF_WORKER_HEALTH_URL: ${{ vars.CF_WORKER_HEALTH_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Check deployment preflight guardrails
        run: python scripts/check_deployment_preflight.py --require-health-url

      - name: Verify Worker secret bindings
        run: python scripts/check_cloudflare_worker_secrets.py --config cloudflare/wrangler.toml SUPER_USER_USERNAME

      - name: Export D1 backup before migrations
        run: |
          mkdir -p .tmp/d1-backups
          npx wrangler d1 export "$CF_D1_DATABASE" \
            --remote \
            --output ".tmp/d1-backups/pre-deploy-${GITHUB_RUN_ID}.sql" \
            --skip-confirmation \
            --config cloudflare/wrangler.toml

      - name: Upload D1 pre-deploy backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: d1-pre-deploy-backup-${{ github.run_id }}
          path: .tmp/d1-backups/*.sql
          if-no-files-found: error
          retention-days: 14

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$CF_D1_DATABASE" --remote --config cloudflare/wrangler.toml

      - name: Deploy Python Worker API
        id: deploy-worker
        run: npx wrangler deploy --config cloudflare/wrangler.toml --strict --message "GitHub Actions ${GITHUB_SHA}"

      - name: Deploy Cloudflare Pages frontend
        working-directory: frontend
        run: ../node_modules/.bin/wrangler pages deploy . --project-name "$CF_PAGES_PROJECT" --branch "$CF_PAGES_PRODUCTION_BRANCH"

      - name: Verify deployed Pages frontend
        run: |
          python scripts/check_pages_frontend.py \
            --url "https://${CF_PAGES_PROJECT}.pages.dev/" \
            --project "$CF_PAGES_PROJECT" \
            --expected-branch "$CF_PAGES_PRODUCTION_BRANCH" \
            --expected-source "$GITHUB_SHA"

      - name: Verify deployed health freshness
        run: |
          if [ -z "$CF_WORKER_HEALTH_URL" ]; then
            echo "CF_WORKER_HEALTH_URL repository variable must point to the deployed /api/health endpoint." >&2
            exit 1
          fi
          python scripts/check_cloudflare_health.py \
            --url "$CF_WORKER_HEALTH_URL" \
            --max-cache-age-hours 36 \
            --reject-offline-seed

      - name: Verify deployed Worker CORS for Pages fallback
        run: |
          python scripts/check_cloudflare_cors.py \
            --health-url "$CF_WORKER_HEALTH_URL" \
            --origin "https://${CF_PAGES_PROJECT}.pages.dev"

      - name: Run deployed public smoke
        run: |
          python scripts/run_remote_smoke.py \
            --health-url "$CF_WORKER_HEALTH_URL" \
            --max-cache-age-hours 36 \
            --reject-offline-seed

      - name: Verify deployed Pages API redirect
        run: |
          python scripts/check_pages_api_redirect.py \
            --url "https://${CF_PAGES_PROJECT}.pages.dev/api/health" \
            --expected-origin "https://stock-scanner-beta-api.pcedison.workers.dev"

      - name: Roll back Worker after failed post-deploy verification
        if: failure() && steps.deploy-worker.outcome == 'success'
        run: npx wrangler rollback --config cloudflare/wrangler.toml --yes --message "Rollback after failed GitHub Actions deployment ${GITHUB_RUN_ID}"

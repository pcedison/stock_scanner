name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "20 1,5,9,13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CF_R2_BUCKET: stock-scanner-beta-cache
      CF_D1_DATABASE: stock-scanner-beta-db
      CF_PAGES_PROJECT: stock-scanner-beta
      CF_WORKER_HEALTH_URL: ${{ vars.CF_WORKER_HEALTH_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run quality gates
        run: |
          python -m pytest -q
          python scripts/check_frontend_hygiene.py
          python scripts/check_operational_readiness.py
          python -m pip check
          npm audit --audit-level=low

      - name: Check deployment preflight guardrails
        run: python scripts/check_deployment_preflight.py --require-health-url

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Validate committed Cloudflare seed cache
        run: |
          mkdir -p .tmp
          python scripts/validate_cloudflare_seed_inputs.py \
            --zip data/official_cache_seed_2026-05-14.zip \
            --summary-md .tmp/seed-quality.md \
            --summary-json .tmp/seed-quality.json \
            --max-age-days 45
          cat .tmp/seed-quality.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild Cloudflare seed from committed cache
        run: |
          if [ -f data/official_cache_seed_2026-05-14.zip ]; then
            unzip -o data/official_cache_seed_2026-05-14.zip -d data
          fi
          CLOUDFLARE_SEED_MODE=offline python scripts/build_cloudflare_seed.py

      - name: Validate generated Worker bundle boundary
        run: npx wrangler deploy --config cloudflare/wrangler.toml --dry-run --outdir .tmp/worker-dry-run

      - name: Upload seed cache to R2
        run: |
          npx wrangler r2 object put "$CF_R2_BUCKET/public/manifest.json" --remote --file cloudflare/seed/manifest.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/companies.json" --remote --file cloudflare/seed/companies.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/data_sources_status.json" --remote --file cloudflare/seed/data_sources_status.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/market_scan_latest.json" --remote --file cloudflare/seed/market_scan_latest.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/analysis_by_code.json" --remote --file cloudflare/seed/analysis_by_code.json
          npx wrangler r2 object put "$CF_R2_BUCKET/public/holding_analysis_by_code.json" --remote --file cloudflare/seed/holding_analysis_by_code.json
          for file in cloudflare/seed/analysis_shards/*.json; do
            shard="$(basename "$file" .json)"
            npx wrangler r2 object put "$CF_R2_BUCKET/public/analysis_shards/$shard.json" --remote --file "$file"
          done
          for file in cloudflare/seed/holding_analysis_shards/*.json; do
            shard="$(basename "$file" .json)"
            npx wrangler r2 object put "$CF_R2_BUCKET/public/holding_analysis_shards/$shard.json" --remote --file "$file"
          done
          npx wrangler r2 object put "$CF_R2_BUCKET/official/official_fundamentals_history.json" --remote --file data/official_fundamentals_history.json
          npx wrangler r2 object put "$CF_R2_BUCKET/official/official_history_backfill_progress.json" --remote --file data/official_history_backfill_progress.json
          npx wrangler r2 object put "$CF_R2_BUCKET/official/official_cache_seed_2026-05-14.zip" --remote --file data/official_cache_seed_2026-05-14.zip

      - name: Export D1 backup before migrations
        run: |
          mkdir -p .tmp/d1-backups
          npx wrangler d1 export "$CF_D1_DATABASE" \
            --remote \
            --output ".tmp/d1-backups/pre-deploy-${GITHUB_RUN_ID}.sql" \
            --skip-confirmation \
            --config cloudflare/wrangler.toml

      - name: Upload D1 pre-deploy backup artifact
        uses: actions/upload-artifact@v6
        with:
          name: d1-pre-deploy-backup-${{ github.run_id }}
          path: .tmp/d1-backups/*.sql
          if-no-files-found: error
          retention-days: 14

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$CF_D1_DATABASE" --remote --config cloudflare/wrangler.toml

      - name: Mark refresh jobs as completed
        run: npx wrangler d1 execute "$CF_D1_DATABASE" --remote --config cloudflare/wrangler.toml --command "UPDATE refresh_jobs SET status = 'success', finished_at = datetime('now'), updated_at = datetime('now') WHERE job_type = 'market_scan' AND status IN ('queued', 'running');"

      - name: Deploy Python Worker API
        id: deploy-worker
        run: npx wrangler deploy --config cloudflare/wrangler.toml --strict --message "GitHub Actions ${GITHUB_SHA}"

      - name: Deploy Cloudflare Pages frontend
        working-directory: frontend
        run: ../node_modules/.bin/wrangler pages deploy . --project-name "$CF_PAGES_PROJECT" --branch "${GITHUB_REF_NAME}"

      - name: Verify deployed health and manifest counts
        run: |
          if [ -z "$CF_WORKER_HEALTH_URL" ]; then
            echo "CF_WORKER_HEALTH_URL repository variable must point to the deployed /api/health endpoint." >&2
            exit 1
          fi
          python scripts/check_cloudflare_health.py \
            --url "$CF_WORKER_HEALTH_URL" \
            --manifest cloudflare/seed/manifest.json

      - name: Run deployed public smoke
        run: python scripts/run_remote_smoke.py --health-url "$CF_WORKER_HEALTH_URL" --manifest cloudflare/seed/manifest.json

      - name: Roll back Worker after failed post-deploy verification
        if: failure() && steps.deploy-worker.outcome == 'success'
        run: npx wrangler rollback --config cloudflare/wrangler.toml --yes --message "Rollback after failed GitHub Actions deployment ${GITHUB_RUN_ID}"
